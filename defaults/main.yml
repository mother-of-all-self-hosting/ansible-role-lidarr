---
# Project source code URL: https://github.com/linuxserver/docker-lidarr

lidarr_enabled: true

lidarr_identifier: lidarr
lidarr_base_path: "/{{ lidarr_identifier }}"
lidarr_data_path: "{{ lidarr_base_path }}/data"

# renovate: datasource=docker depName=linuxserver/lidarr
lidarr_version: 3.1.0.4875-ls36

lidarr_uid: ""
lidarr_gid: ""

# The scheme used for serving Lidarr.
lidarr_scheme: https

# The hostname at which Lidarr is served.
lidarr_hostname: ""

# The path at which Lidarr is served.
# This value must either be `/` or not end with a slash (e.g. `/lidarr`).
lidarr_path_prefix: /

lidarr_container_image: "{{ lidarr_container_image_registry_prefix }}linuxserver/lidarr:{{ lidarr_container_image_tag }}"
lidarr_container_image_tag: "{{ lidarr_version }}"
lidarr_container_image_registry_prefix: "{{ lidarr_container_image_registry_prefix_upstream }}"
lidarr_container_image_registry_prefix_upstream: "{{ lidarr_container_image_registry_prefix_upstream_default }}"
lidarr_container_image_registry_prefix_upstream_default: docker.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
lidarr_container_network: "{{ lidarr_identifier }}"

# Control if the container network is deleted on uninstalling.
lidarr_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `lidarr_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
lidarr_container_http_host_bind_port: ""

# The port number in the container
lidarr_container_http_port: 8686

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
lidarr_container_additional_networks: "{{ lidarr_container_additional_networks_auto + lidarr_container_additional_networks_custom }}"
lidarr_container_additional_networks_auto: []
lidarr_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
lidarr_container_additional_volumes: "{{ lidarr_container_additional_volumes_auto + lidarr_container_additional_volumes_custom }}"
lidarr_container_additional_volumes_auto: []
lidarr_container_additional_volumes_custom: []

# lidarr_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `lidarr_container_labels_additional_labels_custom`.
lidarr_container_labels_traefik_enabled: true
lidarr_container_labels_traefik_docker_network: "{{ lidarr_container_network }}"
lidarr_container_labels_traefik_hostname: "{{ lidarr_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/lidarr`).
lidarr_container_labels_traefik_path_prefix: "{{ lidarr_path_prefix }}"
lidarr_container_labels_traefik_rule: "Host(`{{ lidarr_container_labels_traefik_hostname }}`){% if lidarr_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ lidarr_container_labels_traefik_path_prefix }}`){% endif %}"
lidarr_container_labels_traefik_priority: 0
lidarr_container_labels_traefik_entrypoints: web-secure
lidarr_container_labels_traefik_tls: "{{ lidarr_container_labels_traefik_entrypoints != 'web' }}"
lidarr_container_labels_traefik_tls_certResolver: default  # noqa var-naming
lidarr_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
lidarr_container_labels_traefik_middleware_basic_auth_users: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `lidarr_container_labels_traefik_additional_request_headers_custom`
lidarr_container_labels_traefik_additional_request_headers: "{{ lidarr_container_labels_traefik_additional_request_headers_auto | combine(lidarr_container_labels_traefik_additional_request_headers_custom) }}"
lidarr_container_labels_traefik_additional_request_headers_auto: {}
lidarr_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `lidarr_container_labels_traefik_additional_response_headers_custom`
lidarr_container_labels_traefik_additional_response_headers: "{{ lidarr_container_labels_traefik_additional_response_headers_auto | combine(lidarr_container_labels_traefik_additional_response_headers_custom) }}"
lidarr_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': lidarr_http_header_xss_protection} if lidarr_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': lidarr_http_header_content_type_options} if lidarr_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': lidarr_http_header_content_security_policy} if lidarr_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': lidarr_http_header_permissions_policy} if lidarr_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': lidarr_http_header_strict_transport_security} if lidarr_http_header_strict_transport_security and lidarr_container_labels_traefik_tls else {})
  }}
lidarr_container_labels_traefik_additional_response_headers_custom: {}

# lidarr_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `lidarr_container_labels_additional_labels_custom`
#
# Example:
# lidarr_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
lidarr_container_labels_additional_labels: "{{ lidarr_container_labels_additional_labels_auto + lidarr_container_labels_additional_labels_custom }}"
lidarr_container_labels_additional_labels_auto: []
lidarr_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
lidarr_container_extra_arguments: "{{ lidarr_container_extra_arguments_auto + lidarr_container_extra_arguments_custom }}"
lidarr_container_extra_arguments_auto: []
lidarr_container_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
lidarr_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
lidarr_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
lidarr_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
lidarr_http_header_permissions_policy: "{{ 'interest-cohort=()' if lidarr_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
lidarr_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if lidarr_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `lidarr_http_header_permissions_policy`
lidarr_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `lidarr_http_header_strict_transport_security`
lidarr_hsts_preload_enabled: false

# List of systemd services that the Lidarr systemd service depends on
lidarr_systemd_required_services_list: "{{ lidarr_systemd_required_services_list_default + lidarr_systemd_required_services_list_auto + lidarr_systemd_required_services_list_custom }}"
lidarr_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
lidarr_systemd_required_services_list_auto: []
lidarr_systemd_required_services_list_custom: []

# List of systemd services that the Lidarr systemd service wants
lidarr_systemd_wanted_services_list: "{{ lidarr_systemd_wanted_services_list_default + lidarr_systemd_wanted_services_list_auto + lidarr_systemd_wanted_services_list_custom }}"
lidarr_systemd_wanted_services_list_default: []
lidarr_systemd_wanted_services_list_auto: []
lidarr_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
lidarr_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
lidarr_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
lidarr_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
lidarr_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ lidarr_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ lidarr_container_stop_grace_time_seconds }} {{ lidarr_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ lidarr_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ lidarr_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ lidarr_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ lidarr_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ lidarr_identifier }} after {{ lidarr_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

lidarr_arch: amd64

# Specify the timezone
lidarr_environment_variables_tz: UTC

# Additional environment variables.
lidarr_environment_variables_additional_variables: ""

# lidarr_restart_necessary controls whether the Lidarr systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
lidarr_restart_necessary: false
