---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: lidarr-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        lidarr_debug_service_enabled: false
        lidarr_restarts_check_enabled: true

        # The host directory mounted into the container through
        # `lidarr_container_additional_volumes_custom`, and the file placed in it by
        # prepare.yml. Reading that file from inside the container is what
        # proves the additional volumes reach the systemd unit rather than
        # being merely declared in defaults/main.yml.
        lidarr_molecule_extra_volume_src: /lidarr-molecule-extra
        lidarr_molecule_extra_volume_dst: /molecule-extra
        lidarr_molecule_extra_volume_marker: only-a-real-bind-mount-can-read-this

        # Files placed on the host under the paths the role bind-mounts. Lidarr
        # itself is asked to list them back, so a mount that docker accepted but
        # the process cannot see does not pass.
        lidarr_molecule_marker_filename: lidarr-molecule-marker.txt

        # Nothing about Lidarr's own defaults can produce these. Lidarr's
        # built-in port is 8686, its instance name is "Lidarr" and its API key is
        # randomly generated on first start, so every one of them turning up as
        # this file spells it is attributable to the role and to nothing else.
        # See molecule/default/verify.yml.
        lidarr_molecule_api_key: e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
        lidarr_molecule_instance_name: MoleculeLidarrInstance

        # Variables for Lidarr
        #
        # Deliberately not 1000: the linuxserver.io PUID/PGID pattern has left a
        # needed directory unwritable in other roles of this fleet, and a uid
        # that exists in the test image by accident would hide that.
        lidarr_uid: 1717
        lidarr_gid: 1717

        lidarr_hostname: localhost

        # A non-root path prefix exercises the strip-prefix and slashless
        # redirect middlewares in templates/labels.j2.
        lidarr_path_prefix: /lidarr-ui

        # Bound to the loopback interface of the test container only. Nothing
        # is published to the machine running Molecule, so two scenarios can
        # run side by side without fighting over a port.
        lidarr_container_http_host_bind_port: "127.0.0.1:9117"

        lidarr_container_http_port: 9117

        lidarr_container_additional_volumes_custom:
          - type: bind
            src: "{{ lidarr_molecule_extra_volume_src }}"
            dst: "{{ lidarr_molecule_extra_volume_dst }}"
            options: readonly

        lidarr_container_labels_traefik_enabled: true

        lidarr_container_labels_additional_labels:
          - mash.molecule.additional-label=set-by-the-role

        lidarr_container_extra_arguments:
          - "--label=mash.molecule.extra-argument=set-by-the-role"

        # Neither the role's default of Etc/UTC nor the test host's zone, so
        # that the timezone the container ends up in can only have come from
        # templates/env.j2.
        lidarr_environment_variables_tz: Asia/Tokyo

        lidarr_environment_variables_additional_variables: |
          LIDARR__AUTH__APIKEY={{ lidarr_molecule_api_key }}
          LIDARR__APP__INSTANCENAME={{ lidarr_molecule_instance_name }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
