---
- name: Verify Lidarr
  hosts: all
  become: true
  gather_facts: false

  vars:
    lidarr_verify_base_path: /lidarr
    lidarr_verify_data_path: /lidarr/data

    lidarr_verify_url: "http://{{ lidarr_hostname }}:{{ lidarr_container_http_port }}"
    lidarr_verify_api_url: "http://{{ lidarr_hostname }}:{{ lidarr_container_http_port }}/api/v1"
    lidarr_verify_headers:
      X-Api-Key: "{{ lidarr_molecule_api_key }}"

    # The name carries both the role and the scenario, like the platform does,
    # so a leftover container can never be mistaken for another scenario's.
    lidarr_verify_control_container: "{{ inventory_hostname }}-stock-control"

    # The tag the round trip creates. Distinctive enough that finding it in
    # Lidarr's database cannot be a coincidence.
    lidarr_verify_tag_label: molecule-round-trip-tag

    # Nobody ever creates this one. Asking for it proves the read-back is a
    # search that discriminates, rather than a call returning whatever exists.
    lidarr_verify_absent_tag_label: molecule-never-created-tag

    # The unusual values the scenario configures the role with. Written down
    # here rather than read back out of the inventory, so that a verify run
    # compares the running container against something stated, not against
    # whatever the scenario happens to say at the time.
    lidarr_expected_uid: 1717
    lidarr_expected_gid: 1717
    lidarr_expected_hostname: localhost
    lidarr_expected_path_prefix: /lidarr-ui
    lidarr_expected_timezone: Asia/Tokyo
    lidarr_expected_timezone_abbreviation: JST

    lidarr_verify_units:
      - lidarr.service

  tasks:
    - name: Verify that Lidarr works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: lidarr_defaults

        - name: Inspect Lidarr container
          ansible.builtin.command:
            cmd: docker container inspect lidarr
          register: lidarr_container_raw
          changed_when: false

        - name: Parse the Lidarr container definition
          ansible.builtin.set_fact:
            lidarr_container: "{{ (lidarr_container_raw.stdout | from_json)[0] }}"

        # ------------------------------------------------------------------
        # The negative control, started first so that it boots alongside the
        # assertions below rather than after them
        # ------------------------------------------------------------------

        # The same image, with none of the role's configuration. Anything this one
        # can do unaided is worthless as evidence about the role, and it can do more
        # than one would hope: it serves HTTP 200 on `/`, answers `/ping`, and hands
        # its API key to anyone who asks for `/initialize.json`. An HTTP probe that
        # only looks for a 200 therefore proves nothing at all, which is why every
        # assertion below is about a value this container cannot produce.
        - name: Remove any leftover stock Lidarr control container
          ansible.builtin.command:
            cmd: "docker rm -f {{ lidarr_verify_control_container }}"
          changed_when: false
          failed_when: false

        - name: Run the Lidarr image with none of the role's configuration
          ansible.builtin.command:
            cmd: >-
              docker run -d --rm
              --name {{ lidarr_verify_control_container }}
              {{ lidarr_container.Config.Image }}
          changed_when: true

        # ------------------------------------------------------------------
        # The service the role installed
        # ------------------------------------------------------------------

        - name: Wait for the Lidarr systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: lidarr_services
          until: lidarr_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ lidarr_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Lidarr systemd services are active
          ansible.builtin.assert:
            that: lidarr_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(lidarr_verify_units | zip(lidarr_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Lidarr systemd services log for debugging
          when: lidarr_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ lidarr_verify_units }}"

        # A published Docker port with nothing listening behind it resets the
        # connection rather than refusing it, which `uri` reports as status -1, and
        # the linuxserver.io image restarts Lidarr once while it sets itself up. The
        # loop has to survive both, so failures are tolerated here and judged after.
        - name: Wait for Lidarr to answer on the port the role configured
          ansible.builtin.uri:
            url: "{{ lidarr_verify_url }}/ping"
            method: GET
            follow_redirects: none
          register: lidarr_ping
          until: lidarr_ping.status == 200
          retries: 120
          delay: 5
          failed_when: false

        - name: Assert Lidarr answers on the port the role configured
          ansible.builtin.assert:
            that:
              - lidarr_ping.status == 200
              - (lidarr_ping.json | default({})).get('status', '') == 'OK'
            fail_msg: >-
              Lidarr did not answer on {{ lidarr_verify_url }}/ping
              (status {{ lidarr_ping.status | default('none') }})
            success_msg: "Lidarr answers on {{ lidarr_verify_url }}/ping"

        # ------------------------------------------------------------------
        # What the role told Docker to run
        # ------------------------------------------------------------------

        - name: Collect the mounts the role asked for
          ansible.builtin.set_fact:
            lidarr_config_mount: "{{ lidarr_container.Mounts | selectattr('Destination', 'equalto', '/config') | list }}"
            lidarr_extra_mount: "{{ lidarr_container.Mounts | selectattr('Destination', 'equalto', lidarr_molecule_extra_volume_dst) | list }}"

        - name: Assert that the role's data path is mounted at /config
          ansible.builtin.assert:
            that:
              - lidarr_config_mount | length == 1
              - lidarr_config_mount[0].Type == 'bind'
              - lidarr_config_mount[0].RW
            fail_msg: "The role's data path is not bind-mounted at /config: {{ lidarr_container.Mounts }}"
            success_msg: "{{ lidarr_config_mount[0].Source | default('?') }} is bind-mounted at /config"

        # lidarr_container_additional_volumes_custom has been inert in several roles in
        # this collection - rendered into a comment, or into a `-v` that silently
        # dropped the options. Both the destination and the readonly option have
        # to arrive.
        - name: Assert that lidarr_container_additional_volumes_custom reached the container
          ansible.builtin.assert:
            that:
              - lidarr_extra_mount | length == 1
              - lidarr_extra_mount[0].Type == 'bind'
              - lidarr_extra_mount[0].Source == lidarr_molecule_extra_volume_src
              - not lidarr_extra_mount[0].RW
            fail_msg: "The additional volume did not reach the container: {{ lidarr_container.Mounts }}"
            success_msg: "The additional volume is mounted read-only at {{ lidarr_molecule_extra_volume_dst }}"

        # Reading the file back from inside the
        # container is the difference between the variable existing and it working.
        - name: Read the marker through the additional volume
          ansible.builtin.command:
            cmd: >-
              docker exec lidarr
              cat {{ lidarr_molecule_extra_volume_dst }}/{{ lidarr_molecule_marker_filename }}
          register: lidarr_extra_volume
          changed_when: false

        - name: Assert the additional volume is mounted into the Lidarr container
          ansible.builtin.assert:
            that:
              - lidarr_extra_volume.rc == 0
              - lidarr_extra_volume.stdout | trim == lidarr_molecule_extra_volume_marker
            fail_msg: "The additional volume did not carry the marker into the container"
            success_msg: "The additional volume carries the marker into the container"

        # The `docker create` line in templates/systemd/lidarr.service.j2 has a
        # comment sitting in the middle of a backslash continuation, right in front
        # of the tmpfs that linuxserver.io's read-only mode needs. systemd drops
        # such a comment rather than passing it on to docker, but that is worth
        # holding onto: if it ever stopped doing so, everything after the comment
        # would silently become part of the image name.
        - name: Assert that the read-only container still gets its writable /run
          ansible.builtin.assert:
            that:
              - lidarr_container.HostConfig.ReadonlyRootfs
              - "'/run' in (lidarr_container.HostConfig.Tmpfs | default({}))"
              - "'exec' in lidarr_container.HostConfig.Tmpfs['/run']"
            fail_msg: >-
              The container's root filesystem is
              {{ 'read-only' if lidarr_container.HostConfig.ReadonlyRootfs else 'writable' }}
              and its tmpfs mounts are {{ lidarr_container.HostConfig.Tmpfs | default({}) }}
            success_msg: "The container is read-only with an exec tmpfs at /run"

        - name: Assert that the role's uid and gid reached the container
          ansible.builtin.assert:
            that:
              - lidarr_container.Config.User == (lidarr_expected_uid | string) ~ ':' ~ (lidarr_expected_gid | string)
              - ('PUID=' ~ lidarr_expected_uid) in lidarr_container.Config.Env
              - ('PGID=' ~ lidarr_expected_gid) in lidarr_container.Config.Env
            fail_msg: >-
              The container runs as {{ lidarr_container.Config.User }}
              with {{ lidarr_container.Config.Env | select('match', 'P[UG]ID=') | list }}
            success_msg: "The container runs as {{ lidarr_container.Config.User }} and carries the matching PUID/PGID"

        - name: Assert that the role's timezone reached the container environment
          ansible.builtin.assert:
            that:
              - ('TZ=' ~ lidarr_expected_timezone) in lidarr_container.Config.Env
            fail_msg: "templates/env.j2 did not put TZ={{ lidarr_expected_timezone }} on the container"
            success_msg: "The container environment carries TZ={{ lidarr_expected_timezone }}"

        - name: Assert that the container image is the pinned version
          ansible.builtin.assert:
            that:
              - lidarr_container.Config.Image == 'ghcr.io/linuxserver/lidarr:' ~ lidarr_defaults.lidarr_version
            fail_msg: >-
              The container runs {{ lidarr_container.Config.Image }}, not the
              {{ lidarr_defaults.lidarr_version }} pinned in defaults/main.yml
            success_msg: "The container runs {{ lidarr_container.Config.Image }}"

        - name: Assert the running Lidarr is the version this role installs
          ansible.builtin.assert:
            that: lidarr_container.Config.Labels['org.opencontainers.image.version'] == lidarr_defaults.lidarr_version
            fail_msg: "Lidarr reports {{ lidarr_container.Config.Labels['org.opencontainers.image.version'] | default('none') }}, expected {{ lidarr_defaults.lidarr_version }}"
            success_msg: "Lidarr reports {{ lidarr_container.Config.Labels['org.opencontainers.image.version'] }}"

        # Lidarr keeps its port in the config.xml it maintains for itself under
        # `lidarr_data_path`, which this role does not template. Only the
        # `LIDARR__SERVER__PORT` the role renders into the env file can move it, so
        # a Lidarr listening anywhere other than 8686 is the role's doing. The
        # absence of 8686 matters as much as the presence of the configured port:
        # were the override dropped, the published port and the Traefik label would
        # still say 18686 while the process sat on 8686.
        - name: Read the ports Lidarr listens on
          ansible.builtin.command:
            cmd: docker exec lidarr netstat -lnt
          register: lidarr_listening_raw
          changed_when: false

        - name: Make sense of the ports Lidarr listens on
          ansible.builtin.set_fact:
            lidarr_listening_ports: "{{ lidarr_listening_raw.stdout | regex_findall(':([0-9]+)\\s') | unique }}"

        - name: Assert Lidarr listens on the port the role configured and not on its own default
          ansible.builtin.assert:
            that:
              - lidarr_container_http_port | string in lidarr_listening_ports
              - "'8686' not in lidarr_listening_ports"
            fail_msg: >-
              Lidarr listens on {{ lidarr_listening_ports | join(', ') }}, not on the configured
              {{ lidarr_container_http_port }}, so lidarr_container_http_port does not reach the process
            success_msg: >-
              Lidarr listens on {{ lidarr_container_http_port }} and not on its built-in 8686,
              so lidarr_container_http_port reaches the process

        # ------------------------------------------------------------------
        # Traefik labels
        # ------------------------------------------------------------------

        - name: Assert that the Traefik labels describe the configured hostname and path prefix
          ansible.builtin.assert:
            that:
              - lidarr_container.Config.Labels['traefik.enable'] == 'true'
              - lidarr_container.Config.Labels['traefik.http.routers.lidarr.rule'] == 'Host(`' ~ lidarr_expected_hostname ~ '`) && PathPrefix(`' ~ lidarr_expected_path_prefix ~ '`)'
              - lidarr_container.Config.Labels['traefik.http.middlewares.lidarr-strip-prefix.stripprefix.prefixes'] == lidarr_expected_path_prefix
              - lidarr_container.Config.Labels['traefik.http.services.lidarr.loadbalancer.server.port'] == '9117'
            fail_msg: "The Traefik labels are not what templates/labels.j2 should have produced: {{ lidarr_container.Config.Labels }}"
            success_msg: "The Traefik labels route {{ lidarr_expected_hostname }}{{ lidarr_expected_path_prefix }} to port 9117"

        - name: Assert that the additional labels and extra arguments reached the container
          ansible.builtin.assert:
            that:
              - lidarr_container.Config.Labels['mash.molecule.additional-label'] == 'set-by-the-role'
              - lidarr_container.Config.Labels['mash.molecule.extra-argument'] == 'set-by-the-role'
            fail_msg: >-
              lidarr_container_labels_additional_labels or
              lidarr_container_extra_arguments did not reach the container:
              {{ lidarr_container.Config.Labels }}
            success_msg: "The additional label and the extra argument both reached the container"

        # ------------------------------------------------------------------
        # What the process inside the container actually sees
        # ------------------------------------------------------------------

        - name: Ask the Lidarr container which timezone and user it is running in
          ansible.builtin.command:
            cmd: docker exec lidarr sh -c 'date +%Z; id -u; id -g'
          register: lidarr_process_identity
          changed_when: false

        - name: Assert that the Lidarr process runs in the role's timezone, as the role's user
          ansible.builtin.assert:
            that:
              - lidarr_process_identity.stdout_lines[0] == lidarr_expected_timezone_abbreviation
              - lidarr_process_identity.stdout_lines[1] == lidarr_expected_uid | string
              - lidarr_process_identity.stdout_lines[2] == lidarr_expected_gid | string
            fail_msg: >-
              The container reports zone/uid/gid {{ lidarr_process_identity.stdout_lines }},
              expected [{{ lidarr_expected_timezone_abbreviation }},
              {{ lidarr_expected_uid }}, {{ lidarr_expected_gid }}]
            success_msg: >-
              The Lidarr process runs in {{ lidarr_process_identity.stdout_lines[0] }}
              as {{ lidarr_process_identity.stdout_lines[1] }}:{{ lidarr_process_identity.stdout_lines[2] }}

        # ------------------------------------------------------------------
        # Environment variables
        # ------------------------------------------------------------------

        - name: Read the Lidarr system status
          ansible.builtin.uri:
            url: "{{ lidarr_verify_api_url }}/system/status"
            method: GET
            headers: "{{ lidarr_verify_headers }}"
            follow_redirects: none
          register: lidarr_status
          changed_when: false

        # The API key and the instance name both come from
        # `lidarr_environment_variables_additional_variables`. Lidarr generates a
        # random API key on first start and calls itself "Lidarr", so a status
        # response that answered to the role's key and carries the role's instance
        # name cannot have come from an unconfigured Lidarr.
        - name: Assert the additional environment variables reached Lidarr
          ansible.builtin.assert:
            that:
              - lidarr_status.status == 200
              - lidarr_status.json.instanceName == lidarr_molecule_instance_name
            fail_msg: >-
              Lidarr calls itself {{ lidarr_status.json.instanceName | default('none') }} rather than
              {{ lidarr_molecule_instance_name }}, so lidarr_environment_variables_additional_variables
              does not reach the process
            success_msg: "Lidarr answered the role's API key and calls itself {{ lidarr_molecule_instance_name }}"

        # ------------------------------------------------------------------
        # A round trip through the API and out the other side of the database
        # ------------------------------------------------------------------

        - name: Create a tag through the Lidarr API
          ansible.builtin.uri:
            url: "{{ lidarr_verify_api_url }}/tag"
            method: POST
            headers: "{{ lidarr_verify_headers }}"
            body_format: json
            body:
              label: "{{ lidarr_verify_tag_label }}"
            status_code: [201]
            follow_redirects: none
          changed_when: true

        - name: Read the tags back through the Lidarr API
          ansible.builtin.uri:
            url: "{{ lidarr_verify_api_url }}/tag"
            method: GET
            headers: "{{ lidarr_verify_headers }}"
            follow_redirects: none
          register: lidarr_tags
          changed_when: false

        - name: Assert the Lidarr API returns the tag that was created and nothing else
          ansible.builtin.assert:
            that:
              - lidarr_verify_tag_label in lidarr_tag_labels
              - lidarr_verify_absent_tag_label not in lidarr_tag_labels
            fail_msg: "The Lidarr API returned {{ lidarr_tag_labels | join(', ') }}"
            success_msg: "The Lidarr API returned the tag that was created"
          vars:
            lidarr_tag_labels: "{{ lidarr_tags.json | map(attribute='label') | list }}"

        # The API could be answering out of memory. Lidarr keeps its state in a
        # SQLite database in the directory the role bind-mounts, so the row has to
        # be there too, on the host side of the mount.
        - name: Read the tags out of the Lidarr database
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import json, sqlite3, sys
                connection = sqlite3.connect(sys.argv[1])
                print(json.dumps([row[0] for row in connection.execute('SELECT "Label" FROM "Tags"')]))
              - "{{ lidarr_verify_data_path }}/lidarr.db"
          register: lidarr_database_tags
          changed_when: false

        - name: Assert the tag reached the Lidarr database under the role's data path
          ansible.builtin.assert:
            that:
              - lidarr_verify_tag_label in lidarr_database_labels
              - lidarr_verify_absent_tag_label not in lidarr_database_labels
            fail_msg: "{{ lidarr_verify_data_path }}/lidarr.db holds {{ lidarr_database_labels | join(', ') }}"
            success_msg: >-
              {{ lidarr_verify_data_path }}/lidarr.db holds the tag the API created,
              so Lidarr's state lives where the role put it
          vars:
            lidarr_database_labels: "{{ lidarr_database_tags.stdout | from_json }}"

        # ------------------------------------------------------------------
        # What the negative control has to say
        # ------------------------------------------------------------------

        - name: Wait for the stock Lidarr control container to come up
          ansible.builtin.command:
            cmd: >-
              docker exec {{ lidarr_verify_control_container }}
              wget --quiet --output-document=- http://127.0.0.1:8686/initialize.json
          register: lidarr_control_initialize
          until: lidarr_control_initialize.rc == 0
          retries: 60
          delay: 5
          changed_when: false
          failed_when: false

        - name: Assert the stock Lidarr image serves a different instance entirely
          ansible.builtin.assert:
            that:
              # It comes up unaided, so "it responds" is not evidence about the role.
              - lidarr_control_initialize.rc == 0
              # It is a plain, unauthenticated Lidarr: it hands out its own API key.
              - lidarr_control_json.apiKey | length > 0
              # And that key is not the role's, so the status response above was
              # answered by a Lidarr the role configured.
              - lidarr_control_json.apiKey != lidarr_molecule_api_key
              - lidarr_control_json.instanceName == 'Lidarr'
            fail_msg: >-
              The stock Lidarr image produced {{ lidarr_control_initialize.stdout | default('none') }},
              which makes the assertions above unattributable to the role
            success_msg: >-
              The stock Lidarr image serves its own random API key and calls itself "Lidarr",
              so the configured instance above is the role's doing
          vars:
            lidarr_control_json: "{{ lidarr_control_initialize.stdout | from_json }}"

        - name: Offer the role's API key to the stock Lidarr control container
          ansible.builtin.command:
            cmd: >-
              docker exec {{ lidarr_verify_control_container }}
              wget --quiet --output-document=- --header=X-Api-Key:{{ lidarr_molecule_api_key }}
              http://127.0.0.1:8686/api/v1/system/status
          register: lidarr_control_status
          changed_when: false
          failed_when: false

        - name: Read the ports the stock Lidarr control container listens on
          ansible.builtin.command:
            cmd: "docker exec {{ lidarr_verify_control_container }} netstat -lnt"
          register: lidarr_control_listening
          changed_when: false

        - name: Assert the stock Lidarr image has neither the role's key nor the role's port
          ansible.builtin.assert:
            that:
              - lidarr_control_status.rc != 0
              - "'8686' in lidarr_control_ports"
              - lidarr_container_http_port | string not in lidarr_control_ports
            fail_msg: >-
              The stock Lidarr image accepted the role's API key or listens on
              {{ lidarr_container_http_port }} ({{ lidarr_control_ports | join(', ') }}),
              so neither is evidence that the role configured anything
            success_msg: >-
              The stock Lidarr image rejects the role's API key and listens on its built-in 8686,
              so both are the role's doing
          vars:
            lidarr_control_ports: "{{ lidarr_control_listening.stdout | regex_findall(':([0-9]+)\\s') | unique }}"

        - name: Remove the stock Lidarr control container
          ansible.builtin.command:
            cmd: "docker rm -f {{ lidarr_verify_control_container }}"
          changed_when: true

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "lidarr_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: lidarr_restarts_before
              loop: "{{ lidarr_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: lidarr_restarts_after
              loop: "{{ lidarr_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - lidarr_restarts_after.results | map(attribute='status.NRestarts') | list == lidarr_restarts_before.results | map(attribute='status.NRestarts') | list
                  - lidarr_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in lidarr_verify_units | zip(lidarr_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in lidarr_verify_units | zip(lidarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in lidarr_verify_units | zip(lidarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Lidarr verification summary
          ansible.builtin.debug:
            msg:
              - "Lidarr systemd: {% for unit, state in lidarr_verify_units | zip(lidarr_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Lidarr restarts: {% for unit, restarts in lidarr_verify_units | zip(lidarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Lidarr version: {{ lidarr_status.json.packageVersion }}"
              - "Lidarr listening on: {{ lidarr_listening_ports | join(', ') }} (configured: {{ lidarr_container_http_port }})"
              - "Lidarr instance name: {{ lidarr_status.json.instanceName }}"
              - "Lidarr database: {{ lidarr_status.json.databaseType }} at {{ lidarr_verify_data_path }}/lidarr.db"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Lidarr systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=lidarr.service
          register: lidarr_service_log
          changed_when: false

        - name: Show the Lidarr systemd service log
          ansible.builtin.debug:
            var: lidarr_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
