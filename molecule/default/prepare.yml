---
- name: Prepare Lidarr Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Lidarr Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Lidarr Molecule tests preparation
      ansible.builtin.package:
        name:
          # Used by ansible.builtin.uri when it talks to Lidarr.
          - python3-requests
          # The storage driver below. Docker in a container cannot use the
          # host's overlayfs, and fuse-overlayfs is several times faster than
          # falling back to vfs.
          - fuse-overlayfs
        state: present

    - name: Ensure Docker is installed for Lidarr Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          # `vfs` makes a full copy of every layer. The Lidarr image is large
          # enough for that to dominate the run - `fuse-overlayfs` gives the same
          # nested-container isolation without the copying.
          storage-driver: fuse-overlayfs

    # Bind-mounted into the Lidarr container through
    # `lidarr_container_additional_volumes_custom`. The role does not create the source
    # of an additional volume, so it has to exist before the container is
    # created, or `docker create` refuses the bind. verify.yml reads the marker
    # file back from inside the container, which only works if the systemd unit
    # really carries the additional volumes.
    - name: Ensure the additional volume directory exists for Lidarr Molecule tests
      ansible.builtin.file:
        path: "{{ lidarr_molecule_extra_volume_src }}"
        state: directory
        mode: "0755"

    - name: Ensure a marker file exists in the Lidarr Molecule additional volume
      ansible.builtin.copy:
        content: "{{ lidarr_molecule_extra_volume_marker }}\n"
        dest: "{{ lidarr_molecule_extra_volume_src }}/{{ lidarr_molecule_marker_filename }}"
        mode: "0644"
