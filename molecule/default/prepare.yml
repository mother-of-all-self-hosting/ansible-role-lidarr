---
- name: Prepare Lidarr Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Lidarr Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Lidarr Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
        state: present

    # Mounted into the container through `lidarr_container_additional_volumes_custom`.
    # verify.yml reads the marker file back from inside the container, which only
    # works if the systemd unit really carries the additional volumes.
    - name: Ensure the additional volume directory exists for Lidarr Molecule tests
      ansible.builtin.file:
        path: "{{ lidarr_molecule_extra_volume_src }}"
        state: directory
        mode: "0755"

    - name: Ensure the additional volume marker file exists for Lidarr Molecule tests
      ansible.builtin.copy:
        content: "{{ lidarr_molecule_extra_volume_marker }}\n"
        dest: "{{ lidarr_molecule_extra_volume_src }}/marker.txt"
        mode: "0644"

    - name: Ensure Docker is installed for Lidarr Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: vfs
