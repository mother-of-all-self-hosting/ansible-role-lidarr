---
- name: Check existence of Lidarr systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ lidarr_identifier }}.service"
  register: lidarr_service_stat

- name: Uninstall Lidarr systemd services and files
  when: lidarr_service_stat.stat.exists | bool
  block:
    - name: Ensure Lidarr systemd service is stopped
      ansible.builtin.service:
        name: "{{ lidarr_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure Lidarr systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ lidarr_identifier }}.service"
        state: absent

    - name: Ensure Lidarr support files do not exist
      ansible.builtin.file:
        path: "{{ lidarr_base_path }}/{{ item }}"
        state: absent
      with_items:
        - env
        - labels

    - name: Ensure Lidarr local data path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ lidarr_data_path }}"
      register: lidarr_data_path_deletion_result
      changed_when: lidarr_data_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure Lidarr base path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ lidarr_base_path }}"
      register: lidarr_base_path_deletion_result
      changed_when: lidarr_base_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure Lidarr container network does not exist
      when: lidarr_container_network_deletion_enabled
      block:
        - name: Ensure Lidarr container network does not exist via community.docker.docker_network
          when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ lidarr_container_network }}"
            state: absent
          register: lidarr_network_deletion_result

        - name: Ensure Lidarr container network does not exist via ansible.builtin.command
          when: devture_systemd_docker_base_container_network_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} network rm
              {{ lidarr_container_network }}
          register: lidarr_network_deletion_result
          changed_when: lidarr_container_network in lidarr_network_deletion_result.stdout

- name: Check existence of Lidarr local data path
  ansible.builtin.stat:
    path: "{{ lidarr_data_path }}"
  register: lidarr_data_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Inject the message about the remaining Lidarr local data path
  when: lidarr_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: As the local Lidarr instance has been removed, some old data remains in `" + lidarr_data_path + "`. Feel free to delete it."
        ]
      }}
